<?xml version="1.0" encoding="UTF-8"?>
<!-- 26HP panel: background and section frames only. Rack's SVG renderer ignores <text>,
     so labels are drawn by PanelLabels in src/ui/Components.hpp until they are converted to paths. -->
<svg xmlns="http://www.w3.org/2000/svg" width="132.08mm" height="128.5mm" viewBox="0 0 132.08 128.5">
  <rect x="0" y="0" width="132.08" height="128.5" fill="#d8dadc"/>
  <g fill="none" stroke="#2b2d30" stroke-width="0.3">
    <!-- outer frame -->
    <rect x="2.8" y="7.9" width="126.5" height="111.6" rx="2.5"/>
    <!-- top strip (TABLE / SMOOTH / INDEX / VOLTAGE) -->
    <line x1="2.8" y1="22.9" x2="129.3" y2="22.9"/>
    <!-- LOAD / SAVE / SNAPSHOT box -->
    <path d="M2.8,71.8 H71.8 A2.5,2.5 0 0 1 74.3,74.3 V87.0"/>
    <!-- jack section -->
    <line x1="2.8" y1="87.0" x2="129.3" y2="87.0"/>
  </g>
</svg>
