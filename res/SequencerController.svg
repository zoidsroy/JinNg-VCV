<?xml version="1.0" encoding="UTF-8"?>
<!-- 14HP expander panel: background and section frames only; labels are drawn by
     PanelLabels in src/SequencerController.cpp (Rack's SVG renderer ignores <text>). -->
<svg xmlns="http://www.w3.org/2000/svg" width="71.12mm" height="128.5mm" viewBox="0 0 71.12 128.5">
  <rect x="0" y="0" width="71.12" height="128.5" fill="#d8dadc"/>
  <g fill="none" stroke="#2b2d30" stroke-width="0.3">
    <!-- outer frame -->
    <rect x="2.8" y="7.9" width="65.5" height="111.6" rx="2.5"/>
    <!-- STORAGE box -->
    <path d="M43.0,7.9 V21.0 A2.5,2.5 0 0 0 45.5,23.5 H68.3"/>
    <!-- PARTS | GROUPS | RECORDING -->
    <line x1="2.8" y1="40.1" x2="68.3" y2="40.1"/>
    <line x1="2.8" y1="86.7" x2="68.3" y2="86.7"/>
    <!-- INVERT / ROTATE box -->
    <rect x="16.2" y="56.7" width="25.7" height="14.1" rx="2.5"/>
  </g>
  <!-- card slot -->
  <rect x="60.2" y="9.8" width="2.0" height="13.0" rx="0.4" fill="#2b2d30"/>
  <rect x="60.7" y="10.4" width="1.0" height="11.8" rx="0.2" fill="#0d0e10"/>
</svg>
